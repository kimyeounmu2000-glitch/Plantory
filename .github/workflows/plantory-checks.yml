name: Plantory checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run model tests
        run: node --test tests/legacy/tests.mjs
      - name: Verify generated HTML
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'plantory-generated'
          python scripts/integrate-plantory.py $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = 'Plantory_3D_Integrated_original_models.html'
          # Compare HTML content across checkout and generator newline conventions.
          $generated = [IO.File]::ReadAllText((Join-Path $output $file)).Replace("`r`n", "`n")
          $tracked = [IO.File]::ReadAllText((Join-Path (Resolve-Path app) $file)).Replace("`r`n", "`n")
          if (-not [string]::Equals($generated, $tracked, [StringComparison]::Ordinal)) {
            throw 'Generated HTML differs from app HTML. Regenerate it with python scripts/integrate-plantory.py.'
          }
