name: Plantory checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run model tests
        run: node --test tests/legacy/tests.mjs
      - name: Run revisit browser tests with installed Chrome
        shell: pwsh
        run: |
          $env:PLANTORY_CHROME = 'C:/Program Files/Google/Chrome/Application/chrome.exe'
          if (!(Test-Path -LiteralPath $env:PLANTORY_CHROME)) { throw 'Preinstalled Chrome is required; no package will be installed.' }
          node tests/check-revisit-ux.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify generated HTML
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'plantory-generated'
          python scripts/integrate-plantory.py $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = 'Plantory_3D_Integrated_original_models.html'
          if ((Get-FileHash "$output/$file").Hash -ne (Get-FileHash "app/$file").Hash) {
            throw 'Generated HTML differs from app HTML. Regenerate it with python scripts/integrate-plantory.py.'
          }
